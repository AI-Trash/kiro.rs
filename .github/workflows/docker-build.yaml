name: Build and Push Docker Images

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        with:
          fetch-depth: 0
      - name: Check if commit has release tag
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/heads/* ]] && git tag --points-at HEAD | grep -q '^v'; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping branch build: commit already has a release tag"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  metadata:
    needs: pre-check
    if: needs.pre-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_owner: ${{ steps.metadata.outputs.image_owner }}
      has_release_tag: ${{ steps.metadata.outputs.has_release_tag }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - name: Determine image metadata
        id: metadata
        run: |
          echo "image_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "has_release_tag=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_tag=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs:
      - pre-check
      - metadata
    if: needs.pre-check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Determine image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ needs.metadata.outputs.image_owner }}/kiro-rs"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest-${{ matrix.arch }}"
            if [ "${{ needs.metadata.outputs.has_release_tag }}" = "true" ]; then
              echo "${IMAGE}:${{ needs.metadata.outputs.release_tag }}-${{ matrix.arch }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Kiro.rs Docker Image

  manifest:
    needs:
      - build
      - metadata
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="ghcr.io/${{ needs.metadata.outputs.image_owner }}/kiro-rs"

          # Always publish latest.
          docker manifest create ${IMAGE}:latest \
            ${IMAGE}:latest-amd64 \
            ${IMAGE}:latest-arm64
          docker manifest push ${IMAGE}:latest

          # Tag builds also publish the Git tag.
          if [ "${{ needs.metadata.outputs.has_release_tag }}" = "true" ]; then
            RELEASE_TAG="${{ needs.metadata.outputs.release_tag }}"
            docker manifest create ${IMAGE}:${RELEASE_TAG} \
              ${IMAGE}:${RELEASE_TAG}-amd64 \
              ${IMAGE}:${RELEASE_TAG}-arm64
            docker manifest push ${IMAGE}:${RELEASE_TAG}
          fi
